services:
  api:
    build: .
    image: food-waste-api
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs          # keep prediction logs on the host for drift checks

  ui:
    image: food-waste-api         # same image, different command
    depends_on:
      - api
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
